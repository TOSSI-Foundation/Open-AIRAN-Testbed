# desc: rfsimulator multi-UE testbed -- OCUDU gNB + N OAI nrUEs over rfsim, iperf3 sweep + per-UE report
# https://tossi.org/docs/ran-integration/rfsim-testbed/
COMPONENTS="ocudu oai-nrue rfsim-ue core5g"
START_ORDER="core5g ocudu rfsim-ue"
NEEDS="python3"

OCUDU_BRANCH=rfsim
OAI_BRANCH=rfsim_ocudu
OCUDU_APP=gnb
OCUDU_TARGETS=gnb
CMAKE_OPTS="-DCMAKE_BUILD_TYPE=Release -DENABLE_RFSIM=ON"
OCUDU_CFG=gnb_rfsim.yaml
UE_BUILD_ARGS="--nrUE -w SIMU"

NUM_UES="${NUM_UES:-2}"
RFSIM_BW="${RFSIM_BW:-40}"

HEALTH="ocudu:(====.*started) rfsim-ue:(summary.:)"
HEALTH_TIMEOUT=900
