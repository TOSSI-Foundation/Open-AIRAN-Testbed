# desc: OCUDU CU + split-8 DU over ZMQ with OAI nrUE -- no radio, no accelerator
COMPONENTS="ocudu-cu ocudu oai-nrue core5g"
START_ORDER="core5g ocudu-cu ocudu oai-nrue"
NEEDS="zmq python3"

OCUDU_BRANCH=dev
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_8"
OCUDU_APP=odu
OCUDU_APP_DIR=du_split_8
OCUDU_CFG=du_liteon_zmq.yaml
CU_CFG=cu.yml

UE_CFG=targets/PROJECTS/GENERIC-NR-5GC/CONF/ue.conf
UE_ARGS="--band 78 -C 3489420000 -r 51 --numerology 1 --ssb 0 \
  --uecap_file $WORKSPACE/OAI-RAN/targets/PROJECTS/GENERIC-NR-5GC/CONF/uecap_ports1.xml \
  --device.name oai_zmqdevif \
  --zmq.[0].tx_channels tcp://127.0.0.1:4557 \
  --zmq.[0].rx_channels tcp://127.0.0.1:4556"
UE_BUILD_ARGS="-c --ninja -w ZMQ --nrUE"

OCUDU_HEALTH_CMD="ss -anH --sctp 2>/dev/null | grep -q ESTAB"
HEALTH="ocudu-cu:(CU-CP.started|Connected.to.AMF) ocudu:(Cell.*started|DU.*started|F1.Setup) oai-nrue:(Synched|SIB1)"
