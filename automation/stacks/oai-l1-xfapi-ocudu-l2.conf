# desc: OAI L1 (nFAPI PNF) + xFAPI + OCUDU L2
# https://tossi.org/docs/ran-integration/fapi-split/oai-xfapi-ocudu/
COMPONENTS="ptp xfapi ocudu oai-gnb core5g"
START_ORDER="core5g ptp xfapi ocudu oai-gnb"
NEEDS="dpdk hugepages nic ptp oai"

OCUDU_BRANCH=fapi_split
OCUDU_APP=odu_high
OCUDU_APP_DIR=du
OCUDU_CFG=ocudu_xfapi_oai.yaml
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DPDK=True \
  -DASSERT_LEVEL=MINIMAL -DENABLE_UHD=OFF"

XFAPI_MODE=oai_ocudu
XFAPI_CFG=oai_ocudu_config.yaml

GNB_CFG=targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb-pnf.band78.liteon.conf
OAI_GNB_ARGS="--nfapi PNF"
OAI_FH_TARGET=oran_fhlib_5g
XRAN_LOCATION="$HOME/phy/fhi_lib/lib"

HOSTS="local"
KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
PTP_IF="${PTP_IF:-${IF:-}}"
HEALTH="ptp:(rms|master.offset) xfapi:(bridge.up|nfapi.*listen) ocudu:(====.*started|f1.*setup|Cell.*started) oai-gnb:(PNF.*READY|nfapi.*connected)"
