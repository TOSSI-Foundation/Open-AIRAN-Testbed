# desc: Digital twin -- Sionna RT ray-traced channel live into OCUDU CU/DU + OAI UE over rfsimulator
# https://tossi.org/docs/ran-integration/digital-twins/sionna-rt-ocudu-ran/
COMPONENTS="sionna ocudu-cu ocudu oai-nrue nue core5g"
START_ORDER="core5g sionna ocudu-cu ocudu nue"
NEEDS="zmq python3"

OCUDU_BRANCH=rfsim
OAI_BRANCH=rfsim_ocudu
CMAKE_OPTS="-DCMAKE_BUILD_TYPE=Release -DENABLE_RFSIM=ON -DENABLE_ZEROMQ=ON"
OCUDU_TARGETS="ocu odu"
OCUDU_APP=odu
OCUDU_APP_DIR=du
OCUDU_CFG=du_sionna_rfsim_n78_40mhz.yaml
CU_CFG=cu_sionna_rfsim.yml
OCUDU_ENV="OCUDU_INJECT_ENABLE=0"
OCUDU_TASKSET="${OCUDU_TASKSET:-1-6}"
CU_TASKSET="${CU_TASKSET:-1-2}"

SIONNA_VENV="${SIONNA_VENV:-$HOME/sionna-rt-env}"
SIONNA_PUB="utils/sionna/live_channel.py"
SIONNA_ARGS="${SIONNA_ARGS:---bind tcp://127.0.0.1:5566 --srate 61.44e6 --num-taps 16 \
  --route --steps 12 --loop-route --interval 3.0 \
  --tx-position 8.5 21 27 --rx-start 20 40 1.5 --rx-end 20 260 1.5 --max-drop-db 35}"

UE_BUILD_ARGS="-c --ninja -w SIMU --nrUE"
N_RB=106
UE_CPUS="${UE_CPUS:-7-13}"

HEALTH="sionna:(seq=) ocudu-cu:(====.*started) ocudu:(====.*started) nue:(oaitun_ue1.successfully)"
HEALTH_TIMEOUT=180
