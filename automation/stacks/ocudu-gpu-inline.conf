# desc: OCUDU 7.2 with inline GPU fronthaul -- PRACH & SRS lifted straight off the NIC
# https://tossi.org/docs/ran-integration/hardware-acceleration/inline-gpu-prach-srs/
COMPONENTS="ptp ocudu core5g"
START_ORDER="core5g ptp ocudu"
NEEDS="dpdk hugepages nic ptp gpu cuda"

OCUDU_BRANCH=hwacc_gpu_inline
OCUDU_APP=gnb
OCUDU_BUILD_DIR=build_72
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DPDK=True -DENABLE_GPU_FRONTHAUL=ON \
  -DASSERT_LEVEL=MINIMAL -DENABLE_UHD=OFF -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH:-86}"
OCUDU_TARGETS="gnb ru_emulator srs_inline_benchmark"
OCUDU_CFG="${OCUDU_CFG:-gpu_inline_acc_gnb.yml}"

DPDK_NEEDS_GPUDEV=1

FH_PCI="${FH_PCI:-}"
RU_MAC="${RU_MAC:-}"
DU_MAC="${DU_MAC:-}"

OCUDU_ENV="${OCUDU_ENV:-}"

FH_IF="${FH_IF:-ens6f0}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"
HUGEPAGES_1G=8
KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
HEALTH="ptp:(rms|master.offset) ocudu:(gpu.*fronthaul|Cell.*started)"
