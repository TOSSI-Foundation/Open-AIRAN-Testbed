# desc: NVIDIA Aerial L1 + xFAPI (nvIPC<->xSM) + OCUDU L2, co-located single host
# https://tossi.org/docs/ran-integration/fapi-split/aerial-xfapi-ocudu/
COMPONENTS="ptp aerial xfapi ocudu core5g"
START_ORDER="core5g ptp aerial xfapi ocudu"
NEEDS="gpu cuda ofed nic hugepages ptp dpdk aerial"

OCUDU_BRANCH=dev
OCUDU_APP=odu_high
OCUDU_APP_DIR=du
OCUDU_CFG=aerial_l1_xfapi_ocudu_l2.yaml
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DPDK=ON -DENABLE_UHD=OFF \
  -DASSERT_LEVEL=MINIMAL -DMARCH=${MARCH_OVERRIDE:-armv8-a}"

XFAPI_MODE=aerial_ocudu
XFAPI_CFG=aerial_ocudu_config.yaml
XSM_PAIR=1; XSM_PREFIX=gnb0; DPDK_PROC_TYPE=secondary
NVIPC_PREFIX=nvipc

AERIAL_CFG=cuphycontroller_P5G_FXN.yaml
FH_IF="${FH_IF:-aerial00}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"

KERNEL_PROFILE=aerial-x86
PTP_PROFILE=aerial
HEALTH="ptp:(rms|master.offset) aerial:(nvipc.*ready|cuphycontroller.*running) xfapi:(xsm.*attach|nvipc.*connected) ocudu:(f1.*setup|Cell.*started)"
