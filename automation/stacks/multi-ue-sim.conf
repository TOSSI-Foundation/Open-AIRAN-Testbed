# desc: Multi-UE simulation dashboard against a running OCUDU gNB
# https://tossi.org/docs/ran-integration/multi-ue-sim/
COMPONENTS="ocudu ue-sim core5g"
START_ORDER="core5g ocudu ue-sim"
NEEDS="zmq python3 rust"

OCUDU_BRANCH=dev
OCUDU_APP=gnb
OCUDU_CFG=gnb_zmq.yml
CMAKE_OPTS="-DENABLE_ZEROMQ=ON"
OCUDU_TARGETS=gnb

NUM_UES="${NUM_UES:-10}"
IMSI_BASE="${IMSI_BASE:-001010000000002}"
PROXY_WAVE_SIZE="${PROXY_WAVE_SIZE:-1}"
PROXY_WAVE_DELAY_S="${PROXY_WAVE_DELAY_S:-20}"
N_RB="${N_RB:-51}"

HEALTH="ocudu:(Cell.*started|gNB.started)"
