# desc: OCUDU gNB split-8 over a USRP (X4xx/N3xx/B2xx) via UHD -- real RF
COMPONENTS="ocudu oai-nrue core5g"
START_ORDER="core5g ocudu"
NEEDS="uhd usrp"

OCUDU_BRANCH=dev
OCUDU_APP=gnb
OCUDU_TARGETS=gnb
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_8"

OCUDU_CFG="${OCUDU_CFG:-gnb_rf_n310_fdd_n3_20mhz.yml}"

USRP_ADDR="${USRP_ADDR:-}"
USRP_TYPE="${USRP_TYPE:-x4xx}"
USRP_EXTRA_ARGS="${USRP_EXTRA_ARGS:-}"
USRP_HOST_CIDR="${USRP_HOST_CIDR:-}"
USRP_MTU="${USRP_MTU:-9000}"

HEALTH="ocudu:(Cell.*started|gNB.started)"
