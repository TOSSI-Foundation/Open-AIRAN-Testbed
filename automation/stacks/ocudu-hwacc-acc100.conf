# desc: OCUDU 7.2 with Intel ACC100 LDPC offload (PDSCH+PUSCH bbdev)
# https://tossi.org/docs/ran-integration/hardware-acceleration/acc100-ldpc/
COMPONENTS="ptp ocudu core5g"
START_ORDER="core5g ptp ocudu"
NEEDS="dpdk hugepages nic ptp bbdev"

OCUDU_BRANCH=hwacc_acc100
OCUDU_APP=gnb
OCUDU_BUILD_DIR=build_hwacc
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DPDK=True \
  -DENABLE_PDSCH_HWACC=True -DENABLE_PUSCH_HWACC=True -DASSERT_LEVEL=MINIMAL"
OCUDU_CFG="${OCUDU_CFG:-gnb_ru_liteon_tdd_n78_100mhz.yml}"

ACC100_PF_BDF="${ACC100_PF_BDF:-}"
ACC100_VF_BDF="${ACC100_VF_BDF:-}"
PF_BB_UUID="${PF_BB_UUID:-}"

FH_IF="${FH_IF:-ens6f0}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"
HUGEPAGES_2M=1024
KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
HEALTH="ptp:(rms|master.offset) ocudu:(bbdev.*started|Cell.*started)"
