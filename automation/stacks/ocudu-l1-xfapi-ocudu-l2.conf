# desc: OCUDU L1 - xFAPI - OCUDU L2 over xSM shared memory, single host
# https://tossi.org/docs/ran-integration/fapi-split/xfapi-bridge/
COMPONENTS="ptp xfapi ocudu core5g"
START_ORDER="core5g ptp ocudu-cu ocudu-low xfapi ocudu"
NEEDS="dpdk hugepages nic ptp"

OCUDU_BRANCH=fapi_split
OCUDU_APP=odu_high
OCUDU_APP_DIR=du
OCUDU_CFG=odu_high_xfapi.yaml
CU_CFG=cu.yml; [ -f "$OCUDU_SRC_DIR/configs/cu_oai.yml" ] && CU_CFG=cu_oai.yml
OCUDU_LOW_CFG=odu_low_xfapi.yaml
OCUDU_TARGETS="ocu odu_high odu_low_fapi"
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DPDK=True \
  -DENABLE_XSM_FAPI_SPLIT=ON -DASSERT_LEVEL=MINIMAL"

XFAPI_MODE=ocudu_ocudu
XFAPI_CFG=ocudu_ocudu_config.yaml
XSM_PAIR=1

KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
PTP_IF="${PTP_IF:-${IF:-}}"
if [ -d "$OCUDU_SRC_DIR/apps/fapi_split" ]; then
    CMAKE_OPTS="-DCMAKE_BUILD_TYPE=Release -DDU_SPLIT_TYPE=SPLIT_FAPI"
    OCUDU_BUILD_DIR=build_fapi
    OCUDU_APP_DIR=fapi_split
    OCUDU_LOW_APP_DIR=fapi_split
fi
OCUDU_PREBUILT_BINS="$OCUDU_SRC_DIR/${OCUDU_BUILD_DIR:-build}/apps/cu/ocu $OCUDU_SRC_DIR/${OCUDU_BUILD_DIR:-build}/apps/$OCUDU_APP_DIR/odu_high $OCUDU_SRC_DIR/${OCUDU_BUILD_DIR:-build}/apps/${OCUDU_LOW_APP_DIR:-du}/odu_low"

OCUDU_LOW_HEALTH_CMD="sleep 3; pgrep -x odu_low >/dev/null"
HEALTH="ptp:(rms|master.offset) ocudu-cu:(====.*started) ocudu-low:(alive) xfapi:(OCUDU-L1.peer.attached) ocudu:(====.*started)"
