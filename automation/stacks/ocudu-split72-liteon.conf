# desc: OCUDU gNB split 7.2 against a Liteon O-RU over DPDK fronthaul
COMPONENTS="ptp ocudu core5g"
START_ORDER="core5g ptp ocudu"
NEEDS="dpdk hugepages nic ptp"

OCUDU_BRANCH=dev
OCUDU_APP=gnb
OCUDU_CFG=gnb_ru_liteon_tdd_n78_100mhz.yml
CMAKE_OPTS="-DENABLE_DPDK=ON"
OCUDU_TARGETS=gnb

FH_IF="${FH_IF:-ens6f0}"
FH_VFS="${FH_VFS:-2}"
FH_VLAN="${FH_VLAN:-2}"
RU_MAC="${RU_MAC:-}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"
HUGEPAGES_2M=1024

KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
HEALTH="ptp:(rms|master.offset) ocudu:(Cell.*started|ru.*link.up)"
