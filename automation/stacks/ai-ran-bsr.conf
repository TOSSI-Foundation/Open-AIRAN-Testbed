# desc: AI-RAN ML BSR periodicity -- core, CU, DU with the BSR dataset logger armed (needs a real UE)
# https://tossi.org/docs/ran-integration/ai-ran/bsr-periodicity/
OCUDU_BRANCH=dev
ML_OVERLAY=bsr_collect.yml
ML_MODEL=ml/models/bsr_periodicity.trained.model
ML_TRAIN="python3 ml/training/train_bsr_periodicity.py --model-out $ML_MODEL"
. "$ROOT/stacks/ai-ran-common.sh"

if [ -n "${SIM_UE:-}" ]; then
    COMPONENTS="$COMPONENTS oai-nrue nue dataset"
    START_ORDER="$START_ORDER nue dataset"
    NEEDS="zmq python3"
    UE_BUILD_ARGS="-c --ninja -w ZMQ --nrUE"
    UE_NETNS=ue1
    UE_CPUS="${UE_CPUS:-9-13}"
    DATASET_GLOB="bsr_ml_dataset_*.csv"
    DATASET_ANALYZE=ml/analysis/analyze_bsr_run.py
    COLLECT_SECS="${COLLECT_SECS:-180}"
    HEALTH="$HEALTH nue:(oaitun_ue1.successfully) dataset:(dataset.ready)"
    HEALTH_TIMEOUT=$(( COLLECT_SECS + 240 ))
fi
