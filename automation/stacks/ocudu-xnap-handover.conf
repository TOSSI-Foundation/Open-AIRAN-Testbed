# desc: Inter-gNB Xn handover -- two gNBs, one per server, Liteon 7.2 RUs
# https://tossi.org/docs/ran-integration/xn-handover/
COMPONENTS="ptp ocudu core5g"
START_ORDER="core5g ptp ocudu"
NEEDS="dpdk hugepages nic ptp"

OCUDU_BRANCH=xnap_handover
OCUDU_APP=gnb
GNB_ID="${GNB_ID:-1}"
OCUDU_CFG="gnb_ru_liteon_tdd_n78_100mhz_xnap_gnb${GNB_ID}.yml"
CMAKE_OPTS="-DENABLE_DPDK=ON"
OCUDU_TARGETS=gnb

FH_IF="${FH_IF:-ens6f0}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"
HUGEPAGES_2M=1024

HOSTS="local"
KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
HEALTH="ptp:(rms|master.offset) ocudu:(Cell.*started|xn.*setup)"
