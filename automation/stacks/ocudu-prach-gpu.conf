# desc: OCUDU 7.2 with GPU PRACH detection (cuFFTDx via ENABLE_DFT_GPU)
# https://tossi.org/docs/ran-integration/hardware-acceleration/prach-gpu/
COMPONENTS="ptp ocudu core5g"
START_ORDER="core5g ptp ocudu"
NEEDS="dpdk hugepages nic ptp gpu cuda"

OCUDU_BRANCH=hwacc_gpu
OCUDU_APP=gnb
OCUDU_BUILD_DIR=build_gpu_split7_2
CMAKE_OPTS="-DDU_SPLIT_TYPE=SPLIT_7_2 -DENABLE_DFT_GPU=ON -DENABLE_DPDK=True \
  -DASSERT_LEVEL=MINIMAL"
OCUDU_CFG="${OCUDU_CFG:-gnb_ru_liteon_tdd_n78_100mhz.yml}"

OCUDU_ENV="OCUDU_PRACH_DFT_BACKEND=${OCUDU_PRACH_DFT_BACKEND:-gpu_full}"
MATHDX_PATH="${MATHDX_PATH:-/opt/nvidia-mathdx-26.03.0-cuda13/}"

FH_IF="${FH_IF:-ens6f0}"
PTP_IF="${PTP_IF:-${IF:-$FH_IF}}"
KERNEL_PROFILE=ran-72
PTP_PROFILE=falcon
HEALTH="ptp:(rms|master.offset) ocudu:(gpu.*prach|Cell.*started)"
